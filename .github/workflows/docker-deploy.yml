name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: staffmailacr2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t staffmailacr2026.azurecr.io/staffmailportal:latest .

      - name: Push Docker Image
        run: |
          docker push staffmailacr2026.azurecr.io/staffmailportal:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name staffmailportal-app \
            --resource-group staffmail-rg \
            --image staffmailacr2026.azurecr.io/staffmailportal:latest
